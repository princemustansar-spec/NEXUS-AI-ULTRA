<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS Floating AI</title><link rel="stylesheet" href="/static/avatar.css"></head><body>
<main class="avatar-shell"><header><span><i id="status-dot"></i>NEXUS AI</span><div><button id="interrupt" aria-label="Stop reply and listen">Stop &amp; listen</button><button id="motion" aria-label="Toggle avatar animation">Motion</button><button id="close" aria-label="Close floating avatar">×</button></div></header><button id="mic" aria-label="Start auto voice">Mic</button>
<div class="scene"><canvas class="pywebview-drag-region" id="avatar" aria-label="Animated 3D NEXUS robot"></canvas><div id="fallback" hidden><div class="fallback-face pywebview-drag-region">◈</div><p>3D graphics unavailable</p></div></div>
<section><strong id="phase" role="status">CONNECTING</strong><span id="detail">Drag this window to move</span><div class="level-track"><div id="level"></div></div><button id="dashboard">Open NEXUS</button></section></main><script src="/static/avatar.js"></script></body></html>
